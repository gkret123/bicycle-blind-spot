[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bicycle-blind-spot"
version = "0.1.0"
description = "Bicycle blind-spot BLE streaming utilities"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Gabriel Kret" }
]
dependencies = [
  "bleak>=0.22"
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
